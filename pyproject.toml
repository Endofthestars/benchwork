[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchwork-arcana"
version = "0.2.0a3"
description = "An auditable workbench for agent-assisted computational research."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Endofthestars"}]
dependencies = ["jsonschema>=4.18"]

[project.scripts]
bwork = "benchwork.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/benchwork/schemas" = ["schemas/*.json"]
