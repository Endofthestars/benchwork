[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchwork-arcana"
version = "0.2.0rc1"
description = "An auditable workbench for agent-assisted computational research."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Endofthestars"}]
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.8",
  "twine>=5.1",
]

[project.scripts]
bwork = "benchwork.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/benchwork/schemas" = ["schemas/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["benchwork"]
omit = ["src/benchwork/cli/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
