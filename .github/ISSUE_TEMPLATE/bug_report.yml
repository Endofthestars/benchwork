name: Bug report
description: Report a reproducible integrity, lifecycle, CLI, or packaging defect.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, object IDs, and the Benchwork version.
    validations:
      required: true
  - type: dropdown
    id: integrity
    attributes:
      label: Integrity impact
      options:
        - None known
        - Rejection or availability
        - Incorrect projection
        - Chronicle or Receipt integrity
    validations:
      required: true
