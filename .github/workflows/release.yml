name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release assets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(
            python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])'
          )"
          test "${RELEASE_TAG}" = "v${package_version}"

      - name: Install test, packaging, and SBOM tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]" pytest build twine cyclonedx-bom

      - name: Run release gates
        run: |
          python -m pytest
          python scripts/ci/check-release-policy.py
          python scripts/ci/check-schemas.py
          shfmt -d -i 4 -ci install.sh scripts/installer/check-posix.sh
          sh scripts/installer/check-posix.sh

      - name: Build Python distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Build deterministic plugin archive
        run: |
          version="$(python -c 'import benchwork; print(benchwork.__version__)')"
          python scripts/installer/build-plugin-archive.py \
            "dist/benchwork-codex-plugin-${version}.tar.gz" \
            --epoch "${SOURCE_DATE_EPOCH:-0}"

      - name: Capture exact installer and pinned uv bootstrap
        run: |
          cp install.sh dist/install.sh
          curl --fail --silent --show-error --location --max-redirs 3 \
            --proto '=https' --proto-redir '=https' \
            --output dist/uv-install.sh \
            https://astral.sh/uv/0.12.0/install.sh

      - name: Generate SBOM
        run: cyclonedx-py environment --output-format JSON --output-file dist/benchwork-sbom.cdx.json

      - name: Generate manifest, checksums, channel, and provenance
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          asset_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          manifest_url="https://benchwork.dev/releases/${version}/release-manifest.json"
          python scripts/installer/generate-release-assets.py dist \
            --asset-base-url "${asset_base}" \
            --manifest-url "${manifest_url}" \
            --commit "${GITHUB_SHA}" \
            --uv-version 0.12.0
          python -c 'import json; from benchwork.schema_validation import validate_instance; validate_instance("benchwork-release-manifest-1.0.json", json.load(open("dist/release-manifest.json")))'
          python -c 'import json, pathlib; from benchwork.schema_validation import validate_instance; paths=[p for p in pathlib.Path("dist").glob("*.json") if p.name in {"stable.json","rc.json","nightly.json"}]; assert len(paths)==1; validate_instance("benchwork-release-channel-1.0.json", json.load(paths[0].open()))'
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/benchwork_arcana-*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload complete release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/benchwork-arcana
    permissions:
      id-token: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/

      - name: Publish release distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  assets:
    name: Attach immutable GitHub Release assets
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist/

      - name: Upload immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}"

  pages:
    name: Publish byte-identical installer site
    needs:
      - assets
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository with release credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: /tmp/benchwork-release-assets

      - name: Update versioned Pages tree
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          assets=/tmp/benchwork-release-assets
          (cd "${assets}" && sha256sum --check SHA256SUMS)
          channel="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["channel"])' "${assets}/release-manifest.json")"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git switch --force-create gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
            git rm -rf .
          fi
          mkdir -p "releases/${version}" channels
          cp "${assets}/install.sh" install.sh
          cp "${assets}/install.sh" "releases/${version}/install.sh"
          cp "${assets}/release-manifest.json" "releases/${version}/release-manifest.json"
          cp "${assets}/SHA256SUMS" "releases/${version}/SHA256SUMS"
          cp "${assets}/${channel}.json" "channels/${channel}.json"
          printf 'benchwork.dev\n' > CNAME
          cmp "${assets}/install.sh" "releases/${version}/install.sh"
          git add install.sh releases channels CNAME
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "release(installer): publish ${version}"
          git push origin gh-pages

  smoke:
    name: Smoke test immutable published installer
    needs:
      - pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install, verify, and uninstall exact release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          smoke_root="${RUNNER_TEMP}/benchwork-installer-smoke"
          mkdir -p "${smoke_root}/home" "${smoke_root}/work"
          curl --fail --silent --show-error --location --max-redirs 3 \
            --proto '=https' --proto-redir '=https' \
            --output "${smoke_root}/install.sh" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/install.sh"
          cd "${smoke_root}/work"
          export HOME="${smoke_root}/home"
          export XDG_DATA_HOME="${smoke_root}/data"
          export XDG_RUNTIME_DIR="${smoke_root}/runtime"
          sh "${smoke_root}/install.sh" \
            --version "${version}" \
            --install-dir "${smoke_root}/tools" \
            --bin-dir "${smoke_root}/bin" \
            --plugin-scope user \
            --yes \
            --json
          export PATH="${smoke_root}/bin:${PATH}"
          bwork install doctor
          bwork mcp check
          bwork plugin check
          test ! -e "${smoke_root}/work/.benchwork"
          bwork install uninstall
          test ! -e "${smoke_root}/bin/bwork"
