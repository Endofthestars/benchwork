name: Installer CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: POSIX, schemas, and installer tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install package and test tools
        run: python -m pip install --editable ".[dev]"
      - name: Static shell checks
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt
          shfmt -d -i 4 -ci install.sh scripts/installer/check-posix.sh
          sh scripts/installer/check-posix.sh
      - name: Installer unit and fault-injection tests
        run: python -m unittest discover -s tests/installer -t .

  linux:
    name: Shell preflight (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            image: ubuntu:22.04
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: debian-12
            image: debian:12
          - name: fedora-current
            image: fedora:latest
          - name: alpine-unsupported
            image: alpine:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run portable help and syntax checks
        run: |
          if [ "${{ matrix.name }}" = alpine-unsupported ]; then
            output="$(
              docker run --rm -v "${PWD}:/work:ro" -w /work "${{ matrix.image }}" \
                sh -c 'sh install.sh --dry-run --version 0.3.0rc2' 2>&1
            )" && exit 1
            printf '%s\n' "${output}" | grep 'musl-only Linux is not supported'
          else
            docker run --rm -v "${PWD}:/work:ro" -w /work "${{ matrix.image }}" \
              sh -c 'sh -n install.sh && sh install.sh --help >/dev/null'
          fi

  macos:
    name: macOS installer tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: intel
            runner: macos-15-intel
          - name: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --editable ".[dev]"
      - run: python -m unittest discover -s tests/installer -t .
